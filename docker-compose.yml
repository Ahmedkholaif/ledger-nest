services:
  postgres:
    image: postgres:18-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: ledger }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 20 }
  ledger-nest:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ledger
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
